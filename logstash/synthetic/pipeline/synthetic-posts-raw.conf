# =============================================================================
#  Pipeline Logstash: producer sintetico -> Kafka (pipeline.id: ingest-synthetic)
#
#  Stessa destinazione della pipeline Bluesky (posts.raw / posts.dlq), formato di
#  partenza diverso. Qui Logstash fa da "traduttore": a valle Q1 legge un solo formato.
#
#    formato sintetico                    ->  formato posts.raw (come Bluesky)
#    ------------------------------------     ---------------------------------------------
#    author "user00042"                   ->  did  "did:synth:user00042"
#    id + author                          ->  uri  "at://did:synth:user00042/app.bsky.feed.post/<id>"
#    created_at 1794132000123 (epoch ms)  ->  time "2026-11-08T10:00:00.123Z" (ISO 8601 UTC)
#    content                              ->  text
#    language "EN" / "en,es" (stringa)    ->  langs ["en"] / ["en","es"] (array, minuscolo)
#    reply_to "autore/id"                 ->  reply_parent_uri (uri completo)
#    quote_of "autore/id"                 ->  quoted_uri (uri completo)
#    link.title                           ->  link_title
#    (aggiunto)                           ->  source "synthetic"
#    phase                                ->  phase (verita' di riferimento, Q1 la ignora)
#
#  Il metodo did "synth" distingue i post finti in posts.raw, posts.enriched e in
#  Elasticsearch (es. in Kibana: did : did\:synth\:*).
#
#  Stessa logica della pipeline Bluesky:
#    "filtrato"   = dato corretto che non ci interessa -> drop (contato dall'id)
#    "non valido" = dato rotto                         -> posts.dlq con il motivo
#  I dati rotti hanno in piu' il campo sorgente = "synthetic".
# =============================================================================

input {
  tcp {
    id    => "synth_tcp"
    port  => "${LOGSTASH_SYNTHETIC_PORT}"
    codec => json_lines
  }
}

filter {

  # ---------------------------------------------------------------------------
  # 1) CONTROLLO DEI CAMPI OBBLIGATORI (si ferma al primo che fallisce)
  # ---------------------------------------------------------------------------
  if "_jsonparsefailure" in [tags] {
    mutate { id => "synth_errore_json_non_valido"
             add_field => { "[@metadata][errore]" => "json_non_valido" } }
  }

  # id: stessi caratteri ammessi per la rkey di Bluesky, perche' finisce nell'uri
  else if [id] !~ /\A[A-Za-z0-9._:~-]{1,512}\z/ {
    mutate { id => "synth_errore_id_non_valido"
             add_field => { "[@metadata][errore]" => "id_non_valido" } }
  }

  # author: finisce nel did e nell'uri
  else if [author] !~ /\A[a-z0-9][a-z0-9._-]{0,63}\z/ {
    mutate { id => "synth_errore_author_non_valido"
             add_field => { "[@metadata][errore]" => "author_non_valido" } }
  }

  else if ![created_at] {
    mutate { id => "synth_errore_created_at_mancante"
             add_field => { "[@metadata][errore]" => "created_at_mancante" } }
  }

  # Come per Bluesky: testo vuoto valido (scartato dopo), testo assente = dato rotto
  else if ![content] and [content] != "" {
    mutate { id => "synth_errore_content_mancante"
             add_field => { "[@metadata][errore]" => "content_mancante" } }
  }

  else if [content] =~ /\A[\s\S]{3001}/ {
    mutate { id => "synth_errore_content_troppo_lungo"
             add_field => { "[@metadata][errore]" => "content_troppo_lungo" } }
  }

  # created_at: epoch in millisecondi -> timestamp. Si scrive in @timestamp, da cui piu' sotto
  # si ricava la stringa ISO 8601 per il campo time. Se fallisce (es. "yesterday"), @timestamp
  # resta l'ora di ricezione e l'evento va in DLQ.
  if ![@metadata][errore] {
    date {
      id             => "synth_converti_created_at"
      match          => [ "created_at", "UNIX_MS" ]
      target         => "@timestamp"
      tag_on_failure => [ "_created_at_non_leggibile" ]
    }
    if "_created_at_non_leggibile" in [tags] {
      mutate { id => "synth_errore_created_at_non_valido"
               add_field => { "[@metadata][errore]" => "created_at_non_valido" } }
    }
  }

  # ---------------------------------------------------------------------------
  # 2) DESTINAZIONE
  # ---------------------------------------------------------------------------

  # 2a) Dato rotto -> posts.dlq. L'evento originale finisce sotto payload, come per Bluesky.
  if [@metadata][errore] {
    mutate {
      id     => "synth_verso_dlq"
      rename => {
        "message"    => "riga_originale"
        "id"         => "[payload][id]"
        "author"     => "[payload][author]"
        "created_at" => "[payload][created_at]"
        "content"    => "[payload][content]"
        "language"   => "[payload][language]"
        "reply_to"   => "[payload][reply_to]"
        "quote_of"   => "[payload][quote_of]"
        "link"       => "[payload][link]"
        "phase"      => "[payload][phase]"
      }
      copy      => { "[@metadata][errore]" => "motivo"
                     "@timestamp"          => "ricevuto_alle" }
      add_field => { "sorgente" => "synthetic" }
    }
    mutate {
      id           => "synth_pulizia_dlq"
      remove_field => [ "@timestamp", "@version", "type", "host", "port", "event", "tags" ]
    }
  }

  # 2b) Post senza testo (vuoto o solo spazi): scartato
  else if [content] !~ /\S/ {
    drop { id => "synth_drop_senza_testo" }
  }

  else {
    # Lingua: stringa -> array. Prima si tolgono gli spazi e si passa in minuscolo,
    # poi si divide sulla virgola ("En, it" -> ["en", "it"]).
    # Dentro un mutate l'ordine e' fisso (gsub, lowercase, ..., split, ..., copy), quindi
    # la copia sta in un mutate a parte, prima.
    mutate { id => "synth_copia_lingua" copy => { "language" => "langs" } }
    mutate {
      id        => "synth_normalizza_lingua"
      gsub      => [ "langs", "\s+", "" ]
      lowercase => [ "langs" ]
      split     => { "langs" => "," }
    }

    # 2c) Solo inglese, come per Bluesky
    if "en" not in [langs] {
      drop { id => "synth_drop_non_inglese" }
    }

    # 2d) Post valido -> posts.raw, con gli stessi nomi di campo dei post Bluesky
    else {
      mutate {
        id        => "synth_post_valido"
        copy      => { "content" => "text" }
        add_field => {
          "[@metadata][key]" => "at://did:synth:%{author}/app.bsky.feed.post/%{id}"
          "uri"              => "at://did:synth:%{author}/app.bsky.feed.post/%{id}"
          "did"              => "did:synth:%{author}"
          "time"             => "%{@timestamp}"
          "source"           => "synthetic"
        }
      }

      # reply_to "autore/id" -> uri completo. La regex garantisce un solo "/", quindi lo split
      # da' esattamente [autore, id]. Se il formato e' sbagliato il post resta, perde il campo.
      if [reply_to] {
        if [reply_to] =~ /\A[a-z0-9][a-z0-9._-]{0,63}\/[A-Za-z0-9._:~-]{1,512}\z/ {
          mutate { copy  => { "reply_to" => "[@metadata][reply]" } }
          mutate { split => { "[@metadata][reply]" => "/" } }
          mutate { add_field => { "reply_parent_uri" =>
                   "at://did:synth:%{[@metadata][reply][0]}/app.bsky.feed.post/%{[@metadata][reply][1]}" } }
        } else {
          mutate { id => "synth_avviso_reply_to_non_valido" }
        }
      }

      if [quote_of] {
        if [quote_of] =~ /\A[a-z0-9][a-z0-9._-]{0,63}\/[A-Za-z0-9._:~-]{1,512}\z/ {
          mutate { copy  => { "quote_of" => "[@metadata][quote]" } }
          mutate { split => { "[@metadata][quote]" => "/" } }
          mutate { add_field => { "quoted_uri" =>
                   "at://did:synth:%{[@metadata][quote][0]}/app.bsky.feed.post/%{[@metadata][quote][1]}" } }
        } else {
          mutate { id => "synth_avviso_quote_of_non_valido" }
        }
      }

      if [link][title] =~ /\S/ {
        mutate { copy  => { "[link][title]" => "link_title" } }
        mutate { strip => [ "link_title" ] }
      }

      # Pulizia: via i campi del formato sintetico e quelli aggiunti da Logstash
      mutate {
        id           => "synth_pulizia_post"
        remove_field => [ "id", "author", "created_at", "content", "language",
                          "reply_to", "quote_of", "link",
                          "@timestamp", "@version", "type", "host", "port",
                          "message", "tags", "event" ]
      }
    }
  }
}

output {
  if [@metadata][errore] {
    kafka {
      id                => "synth_kafka_posts_dlq"
      bootstrap_servers => "${KAFKA_BOOTSTRAP_HOST}:${KAFKA_INTERNAL_PORT}"
      topic_id          => "${KAFKA_TOPIC_DLQ}"
      codec             => json
    }
  } else {
    kafka {
      id                => "synth_kafka_posts_raw"
      bootstrap_servers => "${KAFKA_BOOTSTRAP_HOST}:${KAFKA_INTERNAL_PORT}"
      topic_id          => "${KAFKA_TOPIC_RAW}"
      message_key       => "%{[@metadata][key]}"
      codec             => json
      compression_type  => "lz4"
      linger_ms         => 50
    }
  }

  # Per vedere gli eventi finali mentre sviluppi:
  # stdout { codec => rubydebug { metadata => true } }
}

# =============================================================================
#  CAMPI IN USCITA
#    posts.raw (chiave: uri)
#      uri, did, time, text, langs, source, phase      sempre
#      link_title, reply_parent_uri, quoted_uri         solo se presenti e validi
#    posts.dlq
#      motivo, ricevuto_alle, sorgente, e payload oppure riga_originale
#      motivi: json_non_valido, id_non_valido, author_non_valido, created_at_mancante,
#              created_at_non_valido, content_mancante, content_troppo_lungo
#
#  CONTATORI (gli id iniziano tutti con synth_):
#    docker compose exec logstash curl -s localhost:9600/_node/stats/pipelines/ingest-synthetic \
#      | jq -r '.pipelines[].plugins.filters[]
#               | select(.id | test("^synth_(drop|errore|avviso|verso)"))
#               | "\(.events.in // 0)\t\(.id)"' | sort -rn
#
#  PROVA A MANO (porta pubblicata su 127.0.0.1:5001):
#    echo '{"id":"prova1","author":"mario","created_at":1794132000123,"language":"EN","content":"I love this"}' \
#      | nc -q1 127.0.0.1 5001
# =============================================================================