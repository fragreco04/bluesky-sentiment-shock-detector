# sentiment.monitor -> indice sentiment-1m, _id = window_start
#
# Un documento per finestra. Q3 rielaborato dallo stesso stato produce gli stessi messaggi:
# le copie sovrascrivono lo stesso documento con lo stesso contenuto.

input {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP_HOST}:${KAFKA_INTERNAL_PORT}"
    topics => ["${KAFKA_TOPIC_MONITOR}"]
    group_id => "es-monitor"
    client_id => "es-monitor"
    auto_offset_reset => "earliest"         # retention infinita: al primo avvio carica tutta la serie
    consumer_threads => 1                   # 1 partizione
    codec => json
  }
}

filter {
  if "_jsonparsefailure" in [tags] or ![window_start] {
    drop {}
  }

  mutate {
    remove_field => ["@timestamp", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://${ES_HOST}:${ES_PORT}"]
    index => "${ES_INDEX_MONITOR}"
    document_id => "%{window_start}"
    action => "index"
    manage_template => false
    ilm_enabled => false
    data_stream => false
  }
}