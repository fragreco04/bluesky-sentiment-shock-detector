# alerts + alerts.explained -> indice alerts, _id = alert_id, scritture in upsert
#
# Un documento per episodio, costruito a pezzi:
#   - open       crea il documento (status=open, n_shock_windows=1, picco provvisorio)
#   - closed     aggiorna status, picco, n_shock_windows e aggiunge end e close_reason
#   - explained  aggiunge explanation, significant_terms, ... (campi che gli alert non hanno)
#
# Upsert = update parziale con doc_as_upsert: se il documento non esiste lo crea con i campi
# del messaggio, se esiste sovrascrive SOLO i campi presenti nel messaggio e lascia gli altri.
# Per questo l'ordine tra alerts e alerts.explained non conta (campi disgiunti), mentre
# open prima di closed e' garantito da: 1 partizione, Q3 che scrive in ordine, 1 worker qui.

input {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP_HOST}:${KAFKA_INTERNAL_PORT}"
    topics => ["${KAFKA_TOPIC_ALERTS}", "${KAFKA_TOPIC_ALERTS_EXPLAINED}"]
    group_id => "es-alerts"
    client_id => "es-alerts"
    auto_offset_reset => "earliest"
    consumer_threads => 1
    codec => json
  }
}

filter {
  if "_jsonparsefailure" in [tags] or ![alert_id] {
    drop {}
  }

  mutate {
    remove_field => ["@timestamp", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://${ES_HOST}:${ES_PORT}"]
    index => "${ES_INDEX_ALERTS}"
    document_id => "%{alert_id}"
    action => "update"
    doc_as_upsert => true
    retry_on_conflict => 3                  # due update sullo stesso documento ravvicinati: si riprova
    manage_template => false
    ilm_enabled => false
    data_stream => false
  }
}