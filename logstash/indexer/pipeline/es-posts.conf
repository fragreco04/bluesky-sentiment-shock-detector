# posts.enriched -> indice giornaliero posts-AAAA.MM.GG, _id = uri
#
# Il giorno dell'indice viene da `time` (event time), non dall'orologio di Logstash:
# lo stesso post finisce sempre nello stesso indice, quindi una copia at-least-once
# sovrascrive l'originale invece di creare un secondo documento in un altro indice.

input {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP_HOST}:${KAFKA_INTERNAL_PORT}"
    topics => ["${KAFKA_TOPIC_ENRICHED}"]
    group_id => "es-posts"                  # offset propri: non interferisce con Spark
    client_id => "es-posts"
    auto_offset_reset => "earliest"         # al primo avvio indicizza i 3 giorni gia' presenti nel topic
    consumer_threads => "${KAFKA_TOPIC_ENRICHED_PARTITIONS}"   # un consumer per partizione: di piu' resterebbero fermi
    codec => json
  }
}

filter {
  # Messaggi illeggibili o senza i campi che servono a _id e all'indice: scartati
  if "_jsonparsefailure" in [tags] or ![uri] or ![time] {
    drop {}
  }

  # Nome dell'indice dal giorno di `time`, in UTC. I post piu' vecchi della retention vengono
  # scartati: ILM li cancellerebbe comunque, ma prima creerebbe un indice inutile per ogni giorno
  # (succede quando Logstash recupera un arretrato dopo essere stato spento a lungo).
  ruby {
    init => "
      require 'time'
      @max_age_s = ${ES_POSTS_RETENTION_DAYS} * 86400
    "
    code => "
      begin
        t = Time.iso8601(event.get('time')).utc
      rescue StandardError
        t = nil                         # stringa non ISO 8601: Q1 l'avrebbe gia' scartata, ma non si sa mai
      end
      if t.nil? || Time.now.utc - t > @max_age_s
        event.cancel
      else
        event.set('[@metadata][index]', '${ES_INDEX_POSTS}-' + t.strftime('%Y.%m.%d'))
      end
    "
  }

  # Campi aggiunti da Logstash: nei documenti solo i campi del messaggio
  mutate {
    remove_field => ["@timestamp", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://${ES_HOST}:${ES_PORT}"]
    index => "%{[@metadata][index]}"        # @metadata non finisce nel documento
    document_id => "%{uri}"
    action => "index"                       # crea o sovrascrive: idempotente
    manage_template => false                # template e ILM li gestisce es-init
    ilm_enabled => false
    data_stream => false
  }
}