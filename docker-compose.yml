# Ancore YAML: blocchi riusati con "<<: *nome" (merge superficiale: una chiave
# ridefinita nel servizio sostituisce quella dell'ancora, non si fonde con essa).
x-spark-image: &spark-image          # usata da master, worker, spark-q1, spark-q2
  build:
    context: ./spark
    args:
      SPARK_VERSION: ${SPARK_VERSION}
      SCALA_VERSION: ${SCALA_VERSION}
      SENTIMENT_MODEL_NAME: ${SENTIMENT_MODEL_NAME}
      SENTIMENT_MODEL_PATH: ${SENTIMENT_MODEL_PATH}
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR}
  image: my_spark:${SPARK_VERSION}     # stessa immagine per driver, master e worker (stesso Python, stesso modello)

x-spark-driver: &spark-driver        # usata da spark-q1 e spark-q2: cio' che hanno in comune i due driver
  <<: *spark-image
  init: true
  restart: unless-stopped              # il checkpoint rende il riavvio sicuro: la query riprende dall'ultimo batch confermato
  volumes:
    - ./spark/jobs:${SPARK_JOBS_DIR}:ro
    - spark-checkpoints:${SPARK_CHECKPOINT_DIR}

services:
  producer:
    build: ./jetstream_producer
    container_name: jetstream_producer
    restart: unless-stopped
    init: true
    environment:
      JETSTREAM_URL: ${JETSTREAM_URL}
      LOGSTASH_HOST: ${LOGSTASH_HOST}
      LOGSTASH_PORT: ${LOGSTASH_PORT}
    depends_on:
      logstash:
        condition: service_healthy    # parte solo quando Logstash accetta connessioni

  logstash:
    image: docker.elastic.co/logstash/logstash:${LOGSTASH_VERSION}
    container_name: logstash
    restart: unless-stopped
    ports:
      # Solo per test dal tuo PC; Non viene usata; BIND_ADDRESS=127.0.0.1 = non raggiungibile da altri in rete
      - "${BIND_ADDRESS}:${LOGSTASH_PORT}:${LOGSTASH_PORT}"
    volumes:
      - ./logstash/ingest/pipeline:/usr/share/logstash/pipeline:ro                           # ro: read-only
      - ./logstash/ingest/config/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
    environment:
      LS_JAVA_OPTS: "-Xms${LOGSTASH_HEAP} -Xmx${LOGSTASH_HEAP}"     # heap Java limitato
      LOGSTASH_PORT: ${LOGSTASH_PORT}
      KAFKA_BOOTSTRAP_HOST: ${KAFKA_BOOTSTRAP_HOST}   # nella pipeline: bootstrap_servers => "${KAFKA_BOOTSTRAP_HOST}:${KAFKA_INTERNAL_PORT}"
      KAFKA_INTERNAL_PORT: ${KAFKA_INTERNAL_PORT}
      KAFKA_TOPIC_RAW: ${KAFKA_TOPIC_RAW}       # nella pipeline: topic_id => "${KAFKA_TOPIC_RAW}"
      KAFKA_TOPIC_DLQ: ${KAFKA_TOPIC_DLQ}       # nella pipeline: topic_id => "${KAFKA_TOPIC_DLQ}"
    healthcheck:
      # Healthy quando la porta dell'input TCP è in ascolto
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/${LOGSTASH_PORT}'"]
      start_period: 120s      # Logstash impiega parecchio ad avviarsi: deve bastare anche nel caso peggiore
      start_interval: 5s      # frequenza durante lo start_period
      interval: 5m            # frequenza dopo, quando ormai serve solo come indicatore
      timeout: 5s             # una connessione TCP: 5s sono abbondanti
      retries: 3
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  kafka:
    image: apache/kafka:${KAFKA_VERSION}
    container_name: kafka
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS}:${KAFKA_EXTERNAL_PORT}:${KAFKA_EXTERNAL_PORT}"
    volumes:
      - kafka-data:/var/lib/kafka/data        # dati dei topic: sopravvivono a down/up, spariscono solo con down -v
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_NODE_ID}@${KAFKA_BOOTSTRAP_HOST}:${KAFKA_CONTROLLER_PORT}
      KAFKA_LISTENERS: INTERNAL://:${KAFKA_INTERNAL_PORT},EXTERNAL://:${KAFKA_EXTERNAL_PORT},CONTROLLER://:${KAFKA_CONTROLLER_PORT}
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://${KAFKA_BOOTSTRAP_HOST}:${KAFKA_INTERNAL_PORT},EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}   # dice ai client dove connettersi
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS}   # dati più vecchi cancellabili
      KAFKA_LOG_SEGMENT_BYTES: ${KAFKA_LOG_SEGMENT_BYTES}       # segmenti piccoli: si chiudono prima e la retention funziona
      KAFKA_HEAP_OPTS: "-Xms${KAFKA_HEAP} -Xmx${KAFKA_HEAP}"
      KAFKA_LOG_DIRS: /var/lib/kafka/data     # dove Kafka scrive i dati: esplicito, non il default dell'immagine
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server ${KAFKA_BOOTSTRAP_HOST}:${KAFKA_INTERNAL_PORT} > /dev/null 2>&1"]
      start_period: 60s
      start_interval: 5s      # frequenza durante lo start_period
      interval: 5m            # frequenza dopo, quando ormai serve solo come indicatore
      timeout: 30s            # ogni check avvia una JVM: 10s possono non bastare
      retries: 3

  # Servizio che crea i topic
  kafka-init:
    image: apache/kafka:${KAFKA_VERSION}
    container_name: kafka_init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_TOPICS: ${KAFKA_TOPICS}
      BOOTSTRAP: ${KAFKA_BOOTSTRAP_HOST}:${KAFKA_INTERNAL_PORT}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for spec in $${KAFKA_TOPICS}
        do
          topic="$${spec%%:*}"
          rest="$${spec#*:}"
          partitions="$${rest%%:*}"
          retention="$${rest#*:}"

          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server "$${BOOTSTRAP}" \
            --create --if-not-exists \
            --topic "$${topic}" \
            --partitions "$${partitions}" \
            --replication-factor 1

          /opt/kafka/bin/kafka-configs.sh \
            --bootstrap-server "$${BOOTSTRAP}" \
            --alter --entity-type topics --entity-name "$${topic}" \
            --add-config retention.ms="$${retention}"
        done

  spark-master:
    <<: *spark-image
    container_name: spark_master
    restart: unless-stopped
    init: true
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "${SPARK_MASTER_HOST}", "--port", "${SPARK_MASTER_PORT}"]
    ports:
      - "${BIND_ADDRESS}:${SPARK_MASTER_UI_PORT}:8080"   # UI del master: worker registrati e applicazioni
    environment:
      SPARK_DAEMON_MEMORY: ${SPARK_DAEMON_MEMORY}       # heap del processo master (default 1g)
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/${SPARK_MASTER_HOST}/${SPARK_MASTER_PORT}'"]
      start_period: 60s
      start_interval: 5s      # frequenza durante lo start_period
      interval: 5m            # frequenza dopo, quando ormai serve solo come indicatore
      timeout: 5s             # una connessione TCP: 5s sono abbondanti
      retries: 3

  # Un solo servizio per tutti i worker: sono identici, quindi si scalano invece di
  # copiarli (niente container_name, incompatibile con le repliche; niente porta della
  # UI pubblicata: i worker si vedono dalla UI del master).
  spark-worker:
    <<: *spark-image
    container_name: spark_worker
    restart: unless-stopped
    init: true
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "${SPARK_MASTER_URL}"]
    deploy:
      replicas: ${SPARK_WORKER_REPLICAS}
    environment:
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES}     # core offerti dal worker
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY}   # heap assegnabile agli executor (i processi Python stanno fuori)
      SPARK_DAEMON_MEMORY: ${SPARK_DAEMON_MEMORY}   # heap del processo worker (default 1g)
    volumes:
      - spark-checkpoints:${SPARK_CHECKPOINT_DIR}   # gli executor scrivono lo stato della deduplica nel checkpoint
    depends_on:
      spark-master:
        condition: service_healthy

  spark-driver-q1:                            # Q1: driver dell'arricchimento, spark-submit in client mode sul cluster
    <<: *spark-driver
    container_name: spark_q1
    hostname: ${SPARK_Q1_DRIVER_HOST}     # gli executor richiamano il driver con questo nome
    ports:
      - "${BIND_ADDRESS}:${SPARK_Q1_UI_PORT}:4040"     # Spark UI (tab "Structured Streaming")
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_HOST}:${KAFKA_INTERNAL_PORT}
      INPUT_TOPIC: ${KAFKA_TOPIC_RAW}
      OUTPUT_TOPIC: ${KAFKA_TOPIC_ENRICHED}
      STARTING_OFFSETS: ${SPARK_Q1_STARTING_OFFSETS}
      MAX_OFFSETS_PER_TRIGGER: ${SPARK_Q1_MAX_OFFSETS_PER_TRIGGER}
      TRIGGER_INTERVAL: ${SPARK_Q1_TRIGGER_INTERVAL}
      DEDUP_WATERMARK: ${SPARK_Q1_DEDUP_WATERMARK}
      SHUFFLE_PARTITIONS: ${SPARK_Q1_SHUFFLE_PARTITIONS}
      TORCH_THREADS: ${SPARK_Q1_TORCH_THREADS}         # letto sul driver, arriva alla UDF sugli executor
      SENTIMENT_MODEL_NAME: ${SENTIMENT_MODEL_NAME}
      SENTIMENT_MODEL_PATH: ${SENTIMENT_MODEL_PATH}
      CHECKPOINT_ROOT: ${SPARK_CHECKPOINT_DIR}
      PYTHONUNBUFFERED: "1"
    command:
      - /opt/spark/bin/spark-submit     # e' il metodo ufficiale per avviare spark
      - --master
      - ${SPARK_Q1_MASTER}              # spark://spark-master:7077 = cluster; se fosse stato local[N] = tutto nel driver
      - --deploy-mode
      - client                          # il driver gira qui, gli executor sui worker
      - --driver-memory
      - ${SPARK_Q1_DRIVER_MEMORY}
      - --executor-memory               # heap JVM di ogni executor (il modello sta fuori, nei processi Python)
      - ${SPARK_Q1_EXECUTOR_MEMORY}
      - --executor-cores                # = core del worker: un executor per worker
      - ${SPARK_Q1_EXECUTOR_CORES}
      - --conf
      - spark.task.cpus=${SPARK_Q1_TASK_CPUS}    # core per task: task paralleli per executor = copie del modello
      - --packages                      # connettore Kafka, scaricato all'avvio da Maven Central
      - org.apache.spark:spark-sql-kafka-0-10_${SCALA_VERSION}:${SPARK_VERSION}
      - --conf
      - spark.jars.ivy=/tmp/ivy         # cartella scrivibile per la cache dei jar (l'utente "spark" non ha una home)
      - --conf
      - spark.driver.host=${SPARK_Q1_DRIVER_HOST}   # indirizzo che il driver comunica agli executor
      - --conf
      - spark.driver.bindAddress=0.0.0.0
      - ${SPARK_JOBS_DIR}/${SPARK_Q1_JOB}   # il programma da eseguire
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      spark-worker:
        condition: service_started

  spark-driver-q2:                            # Q2: aggregazione a finestre, driver ed executor nello stesso processo
    <<: *spark-driver
    container_name: spark_q2
    ports:
      - "${BIND_ADDRESS}:${SPARK_Q2_UI_PORT}:4040"     # Spark UI di Q2
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_HOST}:${KAFKA_INTERNAL_PORT}
      INPUT_TOPIC: ${KAFKA_TOPIC_ENRICHED}
      OUTPUT_TOPIC: ${KAFKA_TOPIC_SENTIMENT}
      STARTING_OFFSETS: ${SPARK_Q2_STARTING_OFFSETS}
      MAX_OFFSETS_PER_TRIGGER: ${SPARK_Q2_MAX_OFFSETS_PER_TRIGGER}
      TRIGGER_INTERVAL: ${SPARK_Q2_TRIGGER_INTERVAL}
      WINDOW_DURATION: ${SPARK_Q2_WINDOW}
      WATERMARK_DELAY: ${SPARK_Q2_WATERMARK}
      MAX_FUTURE_SKEW: ${SPARK_Q2_MAX_FUTURE_SKEW}
      SHUFFLE_PARTITIONS: ${SPARK_Q2_SHUFFLE_PARTITIONS}
      CHECKPOINT_ROOT: ${SPARK_CHECKPOINT_DIR}
      PYTHONUNBUFFERED: "1"
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - ${SPARK_Q2_MASTER}              # local[N]: niente cluster, Q1 ha gia' preso tutti i core dei worker
      - --driver-memory
      - ${SPARK_Q2_DRIVER_MEMORY}
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_${SCALA_VERSION}:${SPARK_VERSION}
      - --conf
      - spark.jars.ivy=/tmp/ivy
      - ${SPARK_JOBS_DIR}/${SPARK_Q2_JOB}
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  spark-driver-q3:                            # Q3: detector, driver ed executor nello stesso processo
    <<: *spark-driver
    container_name: spark_q3
    ports:
      - "${BIND_ADDRESS}:${SPARK_Q3_UI_PORT}:4040"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_HOST}:${KAFKA_INTERNAL_PORT}
      INPUT_TOPIC: ${KAFKA_TOPIC_SENTIMENT}
      MONITOR_TOPIC: ${KAFKA_TOPIC_MONITOR}
      ALERTS_TOPIC: ${KAFKA_TOPIC_ALERTS}
      STARTING_OFFSETS: ${SPARK_Q3_STARTING_OFFSETS}
      MAX_OFFSETS_PER_TRIGGER: ${SPARK_Q3_MAX_OFFSETS_PER_TRIGGER}
      TRIGGER_INTERVAL: ${SPARK_Q3_TRIGGER_INTERVAL}
      SHUFFLE_PARTITIONS: ${SPARK_Q3_SHUFFLE_PARTITIONS}
      CHECKPOINT_ROOT: ${SPARK_CHECKPOINT_DIR}
      PYTHONUNBUFFERED: "1"
      # Per un esperimento: DET_K: "4", ecc., insieme a topic di alert e monitor dedicati
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - ${SPARK_Q3_MASTER}
      - --driver-memory
      - ${SPARK_Q3_DRIVER_MEMORY}
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_${SCALA_VERSION}:${SPARK_VERSION}
      - --conf
      - spark.jars.ivy=/tmp/ivy
      - ${SPARK_JOBS_DIR}/${SPARK_Q3_JOB}
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  #  Elastic: Elasticsearch (indici), es-init (template e ILM), logstash-indexer
  #  (Kafka -> Elasticsearch), Kibana (grafici)
  # ---------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: elasticsearch
    restart: unless-stopped
    ports:
      # Per curl e per l'explainer se lo lanci dal PC; i container usano ${ES_HOST}:${ES_PORT}
      - "${BIND_ADDRESS}:${ES_PORT}:${ES_PORT}"
    volumes:
      - es-data:/usr/share/elasticsearch/data       # indici: sopravvivono a down/up, spariscono solo con down -v
    environment:
      discovery.type: single-node                   # un nodo solo: niente ricerca di altri nodi, niente bootstrap checks
      cluster.name: ${ES_CLUSTER_NAME}
      http.port: ${ES_PORT}
      xpack.security.enabled: "false"               # niente TLS e password: porte solo su 127.0.0.1, progetto locale
      xpack.ml.enabled: "false"                     # machine learning di Elastic: non serve, e avvia un processo nativo
      ingest.geoip.downloader.enabled: "false"      # niente download del database GeoIP all'avvio
      ES_JAVA_OPTS: "-Xms${ES_HEAP} -Xmx${ES_HEAP}"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      # Healthy quando il cluster e' almeno yellow (con 0 repliche e un nodo sara' green)
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:${ES_PORT}/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      start_period: 120s
      start_interval: 5s      # frequenza durante lo start_period
      interval: 5m            # frequenza dopo, quando ormai serve solo come indicatore
      timeout: 10s
      retries: 3

  # Servizio che crea policy ILM, template e indici (come kafka-init per i topic)
  es-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}   # immagine gia' scaricata: ha bash e curl
    container_name: es_init
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./elasticsearch/init:/init:ro
    environment:
      ES_HOST: ${ES_HOST}
      ES_PORT: ${ES_PORT}
      ES_INDEX_POSTS: ${ES_INDEX_POSTS}
      ES_INDEX_MONITOR: ${ES_INDEX_MONITOR}
      ES_INDEX_ALERTS: ${ES_INDEX_ALERTS}
      ES_POSTS_RETENTION_DAYS: ${ES_POSTS_RETENTION_DAYS}
    entrypoint: ["/bin/bash", "/init/es-init.sh"]

  # Logstash separato da quello di ingestione: quello sta sul percorso caldo (producer -> Kafka)
  # e non deve risentire di Elasticsearch lento o fermo. Stessa immagine, configurazione diversa.
  logstash-indexer:
    image: docker.elastic.co/logstash/logstash:${LOGSTASH_VERSION}
    container_name: logstash_indexer
    restart: unless-stopped
    volumes:
      - ./logstash/indexer/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/indexer/config/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro   # tre pipeline separate
      - logstash-indexer-data:/usr/share/logstash/data      # code persistenti: sopravvivono al riavvio
    environment:
      LS_JAVA_OPTS: "-Xms${LOGSTASH_INDEXER_HEAP} -Xmx${LOGSTASH_INDEXER_HEAP}"
      KAFKA_BOOTSTRAP_HOST: ${KAFKA_BOOTSTRAP_HOST}
      KAFKA_INTERNAL_PORT: ${KAFKA_INTERNAL_PORT}
      KAFKA_TOPIC_ENRICHED: ${KAFKA_TOPIC_ENRICHED}
      KAFKA_TOPIC_ENRICHED_PARTITIONS: ${KAFKA_TOPIC_ENRICHED_PARTITIONS}   # nella pipeline: consumer_threads
      KAFKA_TOPIC_MONITOR: ${KAFKA_TOPIC_MONITOR}
      KAFKA_TOPIC_ALERTS: ${KAFKA_TOPIC_ALERTS}
      KAFKA_TOPIC_ALERTS_EXPLAINED: ${KAFKA_TOPIC_ALERTS_EXPLAINED}
      ES_HOST: ${ES_HOST}
      ES_PORT: ${ES_PORT}
      ES_INDEX_POSTS: ${ES_INDEX_POSTS}
      ES_INDEX_MONITOR: ${ES_INDEX_MONITOR}
      ES_INDEX_ALERTS: ${ES_INDEX_ALERTS}
      ES_POSTS_RETENTION_DAYS: ${ES_POSTS_RETENTION_DAYS}
    depends_on:
      kafka-init:
        condition: service_completed_successfully    # i topic esistono
      es-init:
        condition: service_completed_successfully    # template pronti prima della prima scrittura

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION}
    container_name: kibana
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS}:${KIBANA_PORT}:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://${ES_HOST}:${ES_PORT}
      NODE_OPTIONS: "--max-old-space-size=${KIBANA_HEAP_MB}"   # heap di Node.js in MB
      TELEMETRY_OPTIN: "false"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  spark-checkpoints:
  kafka-data:
  es-data:
  logstash-indexer-data: