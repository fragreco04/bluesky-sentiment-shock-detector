x-costanti:
  kafka-bootstrap: &kafka-bootstrap kafka:19092          # host:porta del listener INTERNAL di Kafka

  spark-checkpoint-dir: &spark-checkpoint-dir /opt/spark/checkpoints

  # Indici Elasticsearch
  index-posts: &index-posts posts
  index-monitor: &index-monitor sentiment-1m
  index-alerts: &index-alerts alerts
  posts-retention-days: &posts-retention-days "3"

  # Modello di sentiment
  sentiment-model-name: &sentiment-model-name cardiffnlp/twitter-roberta-base-sentiment-latest
  sentiment-model-path: &sentiment-model-path /opt/models/twitter-roberta-base-sentiment-latest   # dove il modello sta nell'immagine
  ov-path: &ov-path /opt/models-ov  # modelli esportati da OpenVINO


x-spark-build: &spark-build                        # build dell'immagine Spark, fatta solo da Q1 e riusata da Q2+Q3
  context: ./spark
  args:
    SPARK_VERSION: ${SPARK_VERSION}
    SCALA_VERSION: ${SCALA_VERSION}
    SENTIMENT_MODEL_NAME: *sentiment-model-name
    SENTIMENT_MODEL_PATH: *sentiment-model-path
    SENTIMENT_OV_DIR: *ov-path
    SPARK_CHECKPOINT_DIR: *spark-checkpoint-dir

x-spark-driver: &spark-driver
  image: my_spark:${SPARK_VERSION}
  init: true
  restart: unless-stopped
  volumes:
    - ./spark/jobs:/opt/spark/jobs:ro
    - spark-checkpoints:/opt/spark/checkpoints
    - sentiment-ov:/opt/models-ov      # modelli OpenVINO: si esportano una volta, restano tra i riavvii

services:
  producer:
    build: ./jetstream_producer
    container_name: jetstream_producer
    restart: unless-stopped
    init: true
    environment:
      JETSTREAM_URL: ${JETSTREAM_URL}
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
    depends_on:
      logstash:
        condition: service_healthy

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION}
    container_name: logstash
    restart: unless-stopped
    cpu_shares: 256
    ports:
      - "${BIND_ADDRESS}:5000:5000"
    volumes:
      - ./logstash/ingest/pipeline:/usr/share/logstash/pipeline/ingest:ro
      - ./logstash/indexer/pipeline:/usr/share/logstash/pipeline/indexer:ro
      - ./logstash/config/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
      - logstash-indexer-data:/usr/share/logstash/data
    environment:
      LS_JAVA_OPTS: "-Xms${LOGSTASH_HEAP} -Xmx${LOGSTASH_HEAP}"
      # Ingestione
      LOGSTASH_PORT: 5000
      KAFKA_BOOTSTRAP_HOST: kafka
      KAFKA_INTERNAL_PORT: 19092
      KAFKA_TOPIC_RAW: ${TOPIC_RAW}
      KAFKA_TOPIC_DLQ: ${TOPIC_DLQ}
      # Indicizzazione
      KAFKA_TOPIC_ENRICHED: ${TOPIC_ENRICHED}
      KAFKA_TOPIC_ENRICHED_PARTITIONS: ${TOPIC_ENRICHED_PARTITIONS}   # in es-posts: consumer_threads (un consumer per partizione)
      KAFKA_TOPIC_MONITOR: ${TOPIC_MONITOR}
      KAFKA_TOPIC_ALERTS: ${TOPIC_ALERTS}
      KAFKA_TOPIC_ALERTS_EXPLAINED: ${TOPIC_ALERTS_EXPLAINED}
      ES_HOST: elasticsearch
      ES_PORT: 9200
      ES_INDEX_POSTS: *index-posts
      ES_INDEX_MONITOR: *index-monitor
      ES_INDEX_ALERTS: *index-alerts
      ES_POSTS_RETENTION_DAYS: *posts-retention-days
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/5000'"]
      start_period: 120s
      start_interval: 5s
      interval: 5m
      timeout: 5s
      retries: 3
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      es-init:
        condition: service_completed_successfully

  kafka:
    image: apache/kafka:${KAFKA_VERSION}
    container_name: kafka
    restart: unless-stopped
    cpu_shares: 256
    ports:
      - "${BIND_ADDRESS}:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092        # dice ai client dove connettersi
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24               # valore di default
      KAFKA_LOG_SEGMENT_BYTES: 134217728          # dimensione massima di ogni segmento
      KAFKA_HEAP_OPTS: "-Xms${KAFKA_HEAP} -Xmx${KAFKA_HEAP}"
      KAFKA_LOG_DIRS: /var/lib/kafka/data     # esplicito: il default dipende dalla versione dell'immagine
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1"]
      start_period: 60s
      start_interval: 5s
      interval: 5m
      timeout: 30s
      retries: 3

  # Servizio che crea i topic
  kafka-init:
    image: apache/kafka:${KAFKA_VERSION}
    container_name: kafka_init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
    # 3 giorni, in millisecondi
      KAFKA_TOPICS: >-
        ${TOPIC_RAW}:3:259200000
        ${TOPIC_DLQ}:1:259200000
        ${TOPIC_ENRICHED}:${TOPIC_ENRICHED_PARTITIONS}:259200000
        ${TOPIC_SENTIMENT}:1:-1
        ${TOPIC_MONITOR}:1:-1
        ${TOPIC_ALERTS}:1:-1
        ${TOPIC_ALERTS_EXPLAINED}:1:-1
      BOOTSTRAP: *kafka-bootstrap
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for spec in $${KAFKA_TOPICS}
        do
          topic="$${spec%%:*}"
          rest="$${spec#*:}"
          partitions="$${rest%%:*}"
          retention="$${rest#*:}"

          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server "$${BOOTSTRAP}" \
            --create --if-not-exists \
            --topic "$${topic}" \
            --partitions "$${partitions}" \
            --replication-factor 1

          /opt/kafka/bin/kafka-configs.sh \
            --bootstrap-server "$${BOOTSTRAP}" \
            --alter --entity-type topics --entity-name "$${topic}" \
            --add-config retention.ms="$${retention}"
        done

  spark-driver-q1:
    <<: *spark-driver
    build: *spark-build
    container_name: spark_q1
    cpu_shares: 1024
    ports:
      - "${BIND_ADDRESS}:4040:4040"
    devices:
      - /dev/dxg:/dev/dxg               # canale WSL verso la GPU di Windows (richiede WSL2 con GPU)
    volumes:                            # sostituisce la lista dell'ancora: le prime tre sono le stesse
      - ./spark/jobs:/opt/spark/jobs:ro
      - spark-checkpoints:/opt/spark/checkpoints
      - sentiment-ov:/opt/models-ov
      - /usr/lib/wsl:/usr/lib/wsl:ro    # librerie del driver Windows, usate dal runtime Intel
    environment:
      LD_LIBRARY_PATH: /usr/lib/wsl/lib   # dove il runtime OpenCL trova libdxcore
      KAFKA_BOOTSTRAP_SERVERS: *kafka-bootstrap
      INPUT_TOPIC: ${TOPIC_RAW}
      OUTPUT_TOPIC: ${TOPIC_ENRICHED}
      STARTING_OFFSETS: earliest
      MAX_OFFSETS_PER_TRIGGER: ${SPARK_Q1_MAX_OFFSETS_PER_TRIGGER}
      TRIGGER_INTERVAL: "10 seconds"
      DEDUP_WATERMARK: "10 minutes"
      SHUFFLE_PARTITIONS: 1         # Perché le task in parallelo sono 1 (con gpu)
      # Inferenza (letti da q1_enrich.py)
      INFER_THREADS: ${SPARK_Q1_TASK_CPUS}
      INFER_BATCH_SIZE: ${SPARK_Q1_INFER_BATCH_SIZE}
      INFER_MAX_LENGTH: 256             # token massimi per testo (un post Bluesky ne usa molti meno)
      INFER_ENGINE: ${SPARK_Q1_INFER_ENGINE}
      SENTIMENT_MODEL_NAME: *sentiment-model-name
      SENTIMENT_MODEL_PATH: *sentiment-model-path
      SENTIMENT_OV_DIR: *ov-path
      CHECKPOINT_ROOT: *spark-checkpoint-dir
      PYTHONUNBUFFERED: "1"
    command:
      - /opt/spark/bin/spark-submit     # e' il metodo ufficiale per avviare spark
      - --master
      - local[${SPARK_Q1_CORES}]        # tutto nel driver
      - --driver-memory                 # heap JVM: qui il driver fa anche da executor (il modello sta fuori, nei processi Python)
      - ${SPARK_Q1_DRIVER_MEMORY}
      - --conf
      - spark.task.cpus=${SPARK_Q1_TASK_CPUS}    # core per task: task paralleli = copie del modello
      - --conf
      - spark.executorEnv.OMP_NUM_THREADS=${SPARK_Q1_TASK_CPUS}
      - --conf
      - spark.executorEnv.MKL_NUM_THREADS=${SPARK_Q1_TASK_CPUS}
      - --conf
      - spark.executorEnv.TOKENIZERS_PARALLELISM=false   # il tokenizer non apre un suo pool di thread
      - --packages                      # connettore Kafka, scaricato all'avvio da Maven Central
      - org.apache.spark:spark-sql-kafka-0-10_${SCALA_VERSION}:${SPARK_VERSION}
      - --conf
      - spark.ui.retainedJobs=100           # limitiamo quante informazioni tiene la UI di spark. ultimi 100 job
      - --conf
      - spark.ui.retainedStages=100         # ultimi 100 stage
      - --conf
      - spark.sql.ui.retainedExecutions=50  # ultime 50 esecuzioni
      - --conf
      - spark.jars.ivy=/tmp/ivy
      - /opt/spark/jobs/q1_enrich.py    # il programma da eseguire
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # Q2 (finestre) e Q3 (detector), due query indipendenti nella stessa applicazione Spark
  spark-driver-q23:
    <<: *spark-driver
    pull_policy: never
    container_name: spark_q23
    cpu_shares: 256
    ports:
      - "${BIND_ADDRESS}:4041:4040"     # una sola Spark UI per entrambe le query (4040 sull'host e' di Q1)
    environment:
      KAFKA_BOOTSTRAP_SERVERS: *kafka-bootstrap
      CHECKPOINT_ROOT: *spark-checkpoint-dir
      PYTHONUNBUFFERED: "1"
      # Q2: finestre
      Q2_INPUT_TOPIC: ${TOPIC_ENRICHED}
      Q2_OUTPUT_TOPIC: ${TOPIC_SENTIMENT}
      Q2_STARTING_OFFSETS: earliest
      Q2_MAX_OFFSETS_PER_TRIGGER: 20000 # evita il picco di memoria quando recupera l'arretrato
      Q2_TRIGGER_INTERVAL: "10 seconds"
      Q2_WINDOW_DURATION: "1 minute"
      Q2_WATERMARK_DELAY: "2 minutes"
      Q2_MAX_FUTURE_SKEW: "10 minutes"  # scarta i post con orario oltre 10 minuti nel futuro
      Q2_SHUFFLE_PARTITIONS: 2          # due partizioni per creare le finestre in parallelo
      # Q3: detector
      Q3_INPUT_TOPIC: ${TOPIC_SENTIMENT}
      Q3_MONITOR_TOPIC: ${TOPIC_MONITOR}
      Q3_ALERTS_TOPIC: ${TOPIC_ALERTS}
      Q3_STARTING_OFFSETS: earliest
      Q3_MAX_OFFSETS_PER_TRIGGER: 5000  # circa 3,5 giorni di finestre per batch durante il recupero
      Q3_TRIGGER_INTERVAL: "10 seconds"
      Q3_SHUFFLE_PARTITIONS: 1              # la chiave è il modello, quindi tutti i dati finirebbero nella stessa partizione comunque
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[${SPARK_Q23_CORES}]
      - --driver-memory
      - ${SPARK_Q23_DRIVER_MEMORY}
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_${SCALA_VERSION}:${SPARK_VERSION}
      - --conf
      - spark.ui.retainedJobs=100
      - --conf
      - spark.ui.retainedStages=100
      - --conf
      - spark.sql.ui.retainedExecutions=50
      - --conf
      - spark.jars.ivy=/tmp/ivy
      - /opt/spark/jobs/q23_run.py
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: elasticsearch
    restart: unless-stopped
    cpu_shares: 256
    ports:
      - "${BIND_ADDRESS}:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    environment:
      discovery.type: single-node
      cluster.name: bluesky-sentiment
      http.port: 9200
      xpack.security.enabled: "false"               # niente TLS e password: porte solo su 127.0.0.1, progetto locale
      xpack.ml.enabled: "false"                     # machine learning di Elastic: non serve
      ingest.geoip.downloader.enabled: "false"      # niente download del database GeoIP all'avvio
      ES_JAVA_OPTS: "-Xms${ES_HEAP} -Xmx${ES_HEAP}"
    ulimits:                # Alziamo il tetto al numero di file descriptor che es può tenere aperto
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      start_period: 120s
      start_interval: 5s
      interval: 5m
      timeout: 10s
      retries: 3

  es-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: es_init
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./elasticsearch/init:/init:ro
    environment:
      ES_HOST: elasticsearch
      ES_PORT: 9200
      ES_INDEX_POSTS: *index-posts
      ES_INDEX_MONITOR: *index-monitor
      ES_INDEX_ALERTS: *index-alerts
      ES_POSTS_RETENTION_DAYS: *posts-retention-days
    entrypoint: ["/bin/bash", "/init/es-init.sh"]       # inizializza gli indici

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION}
    container_name: kibana
    restart: unless-stopped
    cpu_shares: 256
    ports:
      - "${BIND_ADDRESS}:5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      NODE_OPTIONS: "--max-old-space-size=${KIBANA_HEAP_MB}"
      TELEMETRY_OPTIN: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status > /dev/null"]
      start_period: 180s
      start_interval: 5s
      interval: 5m
      timeout: 10s
      retries: 3
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: kibana_init
    restart: "no"
    depends_on:
      kibana:
        condition: service_healthy
    volumes:
      - ./kibana:/init:ro
    environment:
      KIBANA_URL: http://kibana:5601
    entrypoint: ["/bin/bash", "/init/kibana-init.sh"]       # configura Kibana

volumes:
  spark-checkpoints:
  sentiment-ov:           # Modelli OpenVINO (ov_export.py). Esterno: creare una volta con docker volume create sentiment-ov
    external: true
    name: sentiment-ov
  kafka-data:
  es-data:
  logstash-indexer-data: